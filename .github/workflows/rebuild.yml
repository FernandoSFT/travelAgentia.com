name: Rebuild Astro Site

on:
  workflow_dispatch:
  repository_dispatch:
    types:
      - rebuild-web

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Vercel Deploy Hook
        run: |
          if [ -z "${{ secrets.VERCEL_DEPLOY_HOOK }}" ]; then
            echo "Error: VERCEL_DEPLOY_HOOK secret is not set."
            exit 1
          fi
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X POST "${{ secrets.VERCEL_DEPLOY_HOOK }}")
          echo "Vercel deploy hook triggered with status code: $HTTP_STATUS"
          if [ "$HTTP_STATUS" -ge 400 ]; then
            echo "Failed to trigger Vercel deploy hook"
            exit 1
          fi
