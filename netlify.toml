[build]
  command = "npm run build"
  publish = "dist"

[context.deploy-preview]
  command = "PUBLIC_PREVIEW=true npm run build"

[context.branch-deploy]
  command = "PUBLIC_PREVIEW=true npm run build"

[context.production]
  command = "echo 'Production Netlify deploys are disabled; production is served by Caddy.' && exit 1"

[build.environment]
  NODE_VERSION = "20"
